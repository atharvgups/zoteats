# Native Android Anteats APK. Does not touch iOS, TestFlight, or the App Store.
name: Android

on:
  push:
    branches: ["main", "cursor/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Test and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use runner Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Refuse em dashes
        run: python3 ci/check_copy.py

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble sideload APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/anteats-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anteats-android-apk
          path: android/dist/anteats-android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-sideload
          name: Anteats Android sideload
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: android/dist/anteats-android.apk
          body: |
            Sideload APK for Anteats (Eat, Campus, Study, Settings). Matches iOS 1.0.337 chrome. Not on Google Play.
            Direct download: https://github.com/${{ github.repository }}/releases/download/android-sideload/anteats-android.apk
            On the phone: Settings, allow installs from this source, then open the APK.

  screenshots:
    name: Emulator screenshots
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: anteats-android-apk
          path: android/dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x android/ci/capture_screenshots.sh
            APK_PATH=android/dist/anteats-android.apk android/ci/capture_screenshots.sh android-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteats-android-screenshots
          path: android-screenshots/*.png
          if-no-files-found: warn
