# Capture current-UI App Store screenshots on a 6.7" simulator and replace
# listing media in App Store Connect. NEVER submits for App Review and NEVER
# releases a version — Atharv froze public binary releases.
name: App Store Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["cursor/**"]

jobs:
  capture-and-upload:
    name: Capture + upload listing screenshots (no review)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SUBMIT_FOR_REVIEW: "false"
      RELEASE_PENDING_DEVELOPER_RELEASE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec apple/project.yml --project apple/

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/ZotEats.xcodeproj \
            -scheme ZotEats \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath apple/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Capture screenshots
        run: |
          APP_PATH="apple/DerivedData/Build/Products/Debug-iphonesimulator/ZotEats.app"
          bash apple/scripts/capture_screenshots.sh --app "$APP_PATH" --out screenshots

      - name: Copy listing names into docs/screenshots
        run: |
          mkdir -p docs/screenshots
          cp screenshots/listing/*.png docs/screenshots/

      - name: Check canvas is plain white / black
        run: |
          python3 -m pip install --quiet Pillow
          python3 apple/scripts/check_screenshot_canvas.py screenshots/listing

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            screenshots/
            docs/screenshots/*.png
          if-no-files-found: error

      - name: Check App Store Connect secrets
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Upload screenshots to App Store Connect (no review, no release)
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/asc-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'PyJWT[crypto]' Pillow
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export SCREENSHOT_ROOT="$GITHUB_WORKSPACE"
          export SCREENSHOT_DIR="$GITHUB_WORKSPACE/screenshots/listing"
          export SUBMIT_FOR_REVIEW=false
          export RELEASE_PENDING_DEVELOPER_RELEASE=false
          python apple/scripts/upload_screenshots.py
