# App Store release: archive + upload (optional) then prepare listing & submit
# for App Review via the App Store Connect API.
#
# Triggers:
#   - Push tag `appstore-1.0.25` (marketing version = 1.0.25)
#   - Manual workflow_dispatch
#
# Required repository secrets (same as TestFlight):
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APPLE_TEAM_ID
#
# Optional:
#   REVIEW_CONTACT_PHONE — App Review phone (ASC often requires one)
name: App Store

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "MARKETING_VERSION (CFBundleShortVersionString)"
        required: false
        default: "1.0.25"
      build_number:
        description: "CURRENT_PROJECT_VERSION (defaults to workflow run number)"
        required: false
        default: ""
      submit_only:
        description: "Skip archive/upload; submit latest VALID build already in ASC"
        required: false
        type: boolean
        default: true
      submit_for_review:
        description: "After preparing metadata, submit for App Review"
        required: false
        type: boolean
        default: true
  push:
    tags: ["appstore-*"]

jobs:
  release:
    name: Prepare listing and submit
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
      SUBMIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.submit_only || github.event_name == 'push' && false }}
      # Tag pushes always submit; workflow_dispatch honors the checkbox (default true).
      SUBMIT_FOR_REVIEW: ${{ github.event_name == 'push' && 'true' || inputs.submit_for_review }}
    steps:
      - name: Check required secrets
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        if: env.SUBMIT_ONLY != 'true'
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: env.SUBMIT_ONLY != 'true'
        run: brew install xcodegen

      - name: Configure team in project spec
        if: env.SUBMIT_ONLY != 'true'
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$APPLE_TEAM_ID\"/" apple/project.yml

      - name: Generate Xcode project
        if: env.SUBMIT_ONLY != 'true'
        run: xcodegen generate --spec apple/project.yml --project apple/

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            MARKETING_VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_NAME" == appstore-* ]]; then
            MARKETING_VERSION="${GITHUB_REF_NAME#appstore-}"
          else
            MARKETING_VERSION="1.0.25"
          fi
          if [ -n "$INPUT_BUILD" ]; then
            BUILD_NUMBER="$INPUT_BUILD"
          elif [ "$SUBMIT_ONLY" = "true" ]; then
            BUILD_NUMBER=""
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Resolved marketing=$MARKETING_VERSION build=${BUILD_NUMBER:-latest-valid} submit_only=$SUBMIT_ONLY"

      - name: Archive
        if: env.SUBMIT_ONLY != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/ZotEats.xcodeproj \
            -scheme ZotEats \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZotEats.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export and upload to App Store Connect
        if: env.SUBMIT_ONLY != 'true'
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/ZotEats.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Prepare listing and submit for review
        env:
          SUBMIT_FOR_REVIEW: ${{ env.SUBMIT_FOR_REVIEW }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/asc-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'PyJWT[crypto]' Pillow
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export MARKETING_VERSION
          export BUILD_NUMBER
          export SCREENSHOT_ROOT="$GITHUB_WORKSPACE"
          export REVIEW_CONTACT_EMAIL="atharvgups@gmail.com"
          export REVIEW_CONTACT_FIRST_NAME="Atharv"
          export REVIEW_CONTACT_LAST_NAME="Gupta"
          python apple/scripts/submit_app_store.py
